<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Refinement Playbook</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--card:#111120;--cb:#0e0e1a;--bd:rgba(255,255,255,.07);--g:#c9a84c;--gl:#e8c96a;--t:#f0ede6;--td:#8a8a9a;--s:#22c55e;--r:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.cn{max-width:820px;margin:0 auto;padding:0 24px}
hr{border:none;border-top:1px solid var(--bd);margin:0}

/* Header */
header{text-align:center;padding:56px 0 48px}
.bdg{display:inline-block;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--g);border:1px solid rgba(201,168,76,.3);padding:6px 16px;border-radius:50px;margin-bottom:20px}
h1{font-size:clamp(28px,5vw,48px);font-weight:900;color:#fff;line-height:1.1;margin-bottom:14px}
h1 span{color:var(--g)}
header p{font-size:15px;color:var(--td);max-width:520px;margin:0 auto;line-height:1.7}

/* Idea input section */
.idea-section{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px;margin-bottom:28px}
.idea-section h2{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
.idea-section p{font-size:13px;color:var(--td);margin-bottom:16px}
textarea{width:100%;background:var(--cb);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;font-size:14px;color:var(--t);font-family:'Inter',sans-serif;line-height:1.7;resize:vertical;min-height:120px;outline:none;transition:border-color .2s}
textarea:focus{border-color:rgba(201,168,76,.4)}
textarea::placeholder{color:var(--td)}
.controls{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center}
select{background:var(--cb);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--t);font-family:'Inter',sans-serif;cursor:pointer;outline:none}
select:focus{border-color:rgba(201,168,76,.4)}
.run-all-btn{flex:1;background:linear-gradient(135deg,var(--g),#a8852f);border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;color:#080810;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;min-width:180px}
.run-all-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(201,168,76,.3)}
.run-all-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Prompt cards */
.pc{background:var(--card);border:1px solid var(--bd);border-radius:20px;margin-bottom:16px;overflow:hidden;transition:border-color .2s}
.pc:hover{border-color:rgba(201,168,76,.15)}
.pc.running{border-color:rgba(201,168,76,.5)}
.pc.done{border-color:rgba(34,197,94,.3)}
.ch{padding:20px 24px;display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
.n{width:40px;height:40px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--g);flex-shrink:0}
.ci{flex:1}
.ct{font-size:16px;font-weight:700;color:#fff}
.cd{font-size:12px;color:var(--td);margin-top:2px}
.actions{display:flex;gap:8px;flex-shrink:0}
.run-btn{padding:8px 16px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:8px;font-size:12px;font-weight:600;color:var(--gl);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.run-btn:hover{background:rgba(201,168,76,.2)}
.run-btn.running{background:rgba(201,168,76,.2);border-color:var(--g)}
.run-btn:disabled{opacity:.4;cursor:not-allowed}
.copy-btn{padding:8px 16px;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:8px;font-size:12px;font-weight:600;color:var(--td);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.copy-btn:hover{background:rgba(255,255,255,.05);color:var(--t)}
.copy-btn.copied{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--s)}
.ch-toggle{font-size:18px;color:var(--td);transition:transform .3s;padding:8px;flex-shrink:0}
.pc.o .ch-toggle{transform:rotate(45deg)}
.cb{display:none;padding:0 24px 24px;border-top:1px solid var(--bd);background:rgba(0,0,0,.12)}
.pc.o .cb{display:block}
.section-label{display:inline-block;font-family:Courier New,monospace;font-size:10px;font-weight:600;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.18);color:var(--gl);padding:2px 8px;border-radius:4px;margin-bottom:10px;margin-top:20px}
.content-block{background:var(--cb);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:14px;font-size:13px;line-height:1.75;color:var(--t);white-space:pre-wrap}
.rule-item,.step-item{display:flex;gap:8px;margin-bottom:5px}
.rule-item:last-child,.step-item:last-child{margin-bottom:0}
.star,.step-n{color:var(--g);font-weight:700;flex-shrink:0;margin-top:1px;font-size:13px}
.output-flow{color:var(--gl);font-weight:600}

/* Output section */
.output-section{display:none;padding:20px 24px;background:rgba(0,0,0,.25);border-top:1px solid rgba(201,168,76,.1)}
.output-section.visible{display:block}
.output-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--s);margin-bottom:12px}
.output-label .dot{width:6px;height:6px;background:var(--s);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.output-content{background:var(--cb);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:20px;font-size:14px;line-height:1.8;color:var(--t);white-space:pre-wrap;max-height:600px;overflow-y:auto}
.output-content::-webkit-scrollbar{width:6px}
.output-content::-webkit-scrollbar-track{background:transparent}
.output-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.output-meta{font-size:11px;color:var(--td);margin-top:10px}
.output-meta span{color:var(--g)}

/* Loading spinner */
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(201,168,76,.3);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--s);color:var(--s);padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:1000;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{border-color:var(--r);color:var(--r)}

/* CTA */
.cta{text-align:center;padding:48px 0;border-top:1px solid var(--bd);margin-top:8px}
.cta h2{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}
.cta p{font-size:14px;color:var(--td)}
footer{text-align:center;padding:24px 0;font-size:11px;color:var(--td);border-top:1px solid var(--bd)}
footer a{color:var(--g);text-decoration:none}

@media(max-width:600px){
.ch{padding:16px 18px}
.cb{padding:0 18px 18px}
textarea{min-height:90px}
.controls{flex-direction:column}
.run-all-btn{width:100%}
.actions{flex-direction:column}
.run-btn,.copy-btn{width:100%;text-align:center}
}
